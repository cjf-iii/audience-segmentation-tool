name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --group dev --group notebook
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit and integration tests
        run: uv run python -m unittest discover -s tests -v
      - name: Execute reviewer notebook
        run: uv run --group notebook jupyter nbconvert --to notebook --execute notebooks/01_data_to_validation.ipynb --stdout > /dev/null
      - name: Full UMAP pipeline
        run: |
          uv run python generate_data.py
          uv run python segment.py --input data/prospects.csv --deals data/deal_history.csv --clusters auto --output results
          uv run python scripts/verify_artifacts.py
      - name: Streamlit smoke test
        run: |
          uv run python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py")
          app.run(timeout=60)
          assert not app.exception, app.exception
          PY
