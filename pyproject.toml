[project]
name = "audience-segmentation-tool"
version = "1.0.0"
description = "Reproducible NLP audience segmentation with CLI and Streamlit interfaces."
readme = "README.md"
authors = [{ name = "CJ Fleming" }]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numba>=0.60.0,<1",
    "numpy>=1.26.0,<2.5",
    "pandas>=2.2.0,<4",
    "plotly>=5.15.0",
    "scikit-learn>=1.5.0,<2",
    "streamlit>=1.61.1",
    "umap-learn>=0.5.7,<0.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
]
notebook = [
    "ipykernel>=7,<8",
    "jupyterlab>=4.5,<5",
    "nbconvert>=7.17,<8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
